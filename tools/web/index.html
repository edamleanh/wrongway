<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrongway vs Bot</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #fffdf8;
    --ink: #1f2328;
    --muted: #6b6f76;
    --line: #e2ddd2;
    --cell: #e9e3d6;
    --cell-hover: #ddd5c4;
    --goal-you: #d7e6f7;
    --goal-bot: #f6dfd3;
    --you: #2563c9;
    --you-soft: rgba(37, 99, 201, .18);
    --bot: #d4542b;
    --bot-soft: rgba(212, 84, 43, .18);
    --ok: #2f8f5b;
    --bad: #c23b3b;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --panel: #1d2024; --ink: #e8e6e1; --muted: #9a9ea6; --line: #2e3238;
      --cell: #2a2e34; --cell-hover: #353a42; --goal-you: #1e3350; --goal-bot: #4a2a1f;
      --you: #5b93ee; --you-soft: rgba(91,147,238,.22); --bot: #ef7b52; --bot-soft: rgba(239,123,82,.22);
      --ok: #4cbf82; --bad: #e86060; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a; --panel: #1d2024; --ink: #e8e6e1; --muted: #9a9ea6; --line: #2e3238;
    --cell: #2a2e34; --cell-hover: #353a42; --goal-you: #1e3350; --goal-bot: #4a2a1f;
    --you: #5b93ee; --you-soft: rgba(91,147,238,.22); --bot: #ef7b52; --bot-soft: rgba(239,123,82,.22);
    --ok: #4cbf82; --bad: #e86060; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 40px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 500; }
  .hint { color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .board-card { padding: 16px; }
  .status {
    display: flex; align-items: center; gap: 10px; font-weight: 600; margin: 2px 4px 14px; min-height: 26px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .status.thinking .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .status .err { color: var(--bad); font-weight: 500; margin-left: auto; font-size: 13px; }
  svg { width: 100%; height: auto; display: block; touch-action: manipulation; user-select: none; }
  .cell { fill: var(--cell); }
  .cell.goal-you { fill: var(--goal-you); }
  .cell.goal-bot { fill: var(--goal-bot); }
  .cell.legal { cursor: pointer; }
  .cell.legal:hover { fill: var(--cell-hover); }
  .legal-dot { fill: var(--you); opacity: .55; pointer-events: none; }
  .last { fill: none; stroke-width: 2.5; stroke-dasharray: 5 4; pointer-events: none; }
  .wall { rx: 3; }
  .wall.you { fill: var(--you); }
  .wall.bot { fill: var(--bot); }
  .wall.new { animation: drop .25s ease-out; }
  @keyframes drop { from { opacity: 0; } }
  .preview { pointer-events: none; rx: 3; }
  .preview.ok { fill: var(--you); opacity: .45; }
  .preview.no { fill: var(--bad); opacity: .35; }
  .zone { fill: transparent; cursor: pointer; }
  .pawn { transition: transform .28s cubic-bezier(.3,.7,.3,1); pointer-events: none; }
  .pawn circle.body { stroke: var(--panel); stroke-width: 3; }
  .pawn text { font-weight: 700; font-size: 15px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .side { display: grid; gap: 16px; }
  .players { padding: 14px; display: grid; gap: 10px; }
  .player { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
  .player.active { border-color: currentColor; }
  .player.you { color: var(--you); }
  .player.bot { color: var(--bot); }
  .player .name { color: var(--ink); font-weight: 600; }
  .player .meta { color: var(--muted); font-size: 12.5px; }
  .walls-left { display: flex; gap: 3px; margin-top: 5px; }
  .walls-left i { width: 6px; height: 14px; border-radius: 2px; background: currentColor; opacity: .9; }
  .walls-left i.used { opacity: .15; }
  .big { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; color: var(--ink); text-align: right; line-height: 1; }
  .big small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 3px; }
  .controls { padding: 14px; display: grid; gap: 12px; }
  .controls h2, .log h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; font-weight: 600; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 6px; border-radius: 7px; font: inherit; font-size: 13.5px; cursor: pointer; }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .btn { flex: 1; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 9px 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: default; }
  .log { padding: 14px; }
  .log ol { list-style: none; margin: 10px 0 0; padding: 0; max-height: 220px; overflow: auto; font-size: 13px; font-variant-numeric: tabular-nums; }
  .log li { display: grid; grid-template-columns: 34px 40px 1fr auto; gap: 6px; padding: 4px 2px; border-top: 1px solid var(--line); }
  .log li .n { color: var(--muted); }
  .log li .t { color: var(--muted); }
  .log li.you .w { color: var(--you); font-weight: 600; }
  .log li.bot .w { color: var(--bot); font-weight: 600; }
  .log .empty { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .banner { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-weight: 600; display: none; align-items: center; justify-content: space-between; gap: 10px; }
  .banner.show { display: flex; }
  .banner.win { background: var(--you-soft); color: var(--you); }
  .banner.lose { background: var(--bot-soft); color: var(--bot); }
  .banner.draw { background: var(--bg); color: var(--muted); }
  .theme { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 8px; padding: 4px 9px; cursor: pointer; font: inherit; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Wrongway <span>· bạn đấu với bot</span></h1>
    <div class="row" style="align-items:center">
      <span class="hint">Bấm ô sáng để đi · rê chuột vào khe giữa các ô để đặt tường</span>
      <button class="theme" id="theme" title="Đổi giao diện sáng/tối">◐</button>
    </div>
  </header>

  <div class="layout">
    <section class="card board-card">
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Đang tải…</span><span class="err" id="err"></span></div>
      <svg id="board" viewBox="0 0 528 528" aria-label="Bàn cờ 9x9"></svg>
      <div class="banner" id="banner"><span id="banner-text"></span><button class="btn primary" style="flex:none" id="again">Chơi lại</button></div>
    </section>

    <aside class="side">
      <div class="card players">
        <div class="player you" id="p-you">
          <span class="dot" style="background:currentColor"></span>
          <div><div class="name">Bạn</div><div class="meta" id="you-meta"></div><div class="walls-left" id="you-walls"></div></div>
          <div class="big" id="you-dist">–<small>bước tới đích</small></div>
        </div>
        <div class="player bot" id="p-bot">
          <span class="dot" style="background:currentColor"></span>
          <div><div class="name" id="bot-name">Bot</div><div class="meta" id="bot-meta"></div><div class="walls-left" id="bot-walls"></div></div>
          <div class="big" id="bot-dist">–<small>bước tới đích</small></div>
        </div>
      </div>

      <div class="card controls">
        <h2>Ván mới</h2>
        <div class="seg" id="side-seg">
          <button data-v="0" class="on">Bạn đi trước</button>
          <button data-v="1">Bot đi trước</button>
        </div>
        <div class="seg" id="level-seg">
          <button data-v="easy">Dễ</button>
          <button data-v="medium">Vừa</button>
          <button data-v="hard" class="on">Khó</button>
        </div>
        <div class="row">
          <button class="btn primary" id="new">Bắt đầu</button>
          <button class="btn" id="undo" title="Đi lại nước vừa rồi">↶ Đi lại</button>
        </div>
      </div>

      <div class="card log">
        <h2>Diễn biến</h2>
        <ol id="log"></ol>
        <div class="empty" id="log-empty">Chưa có nước nào.</div>
      </div>
    </aside>
  </div>
</div>

<script>
(() => {
  const S = 48, G = 12, U = S + G, NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("board");
  let state = null, busy = false, hover = null, flip = false, lastWallKey = null;
  // Lớp cố định: chỉ lớp ô/tường/vùng bắt chuột được vẽ lại; quân và bản xem trước giữ nguyên
  // để quân trượt mượt và rê chuột không phải vẽ lại cả bàn.
  const mk = (tag, attrs) => { const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v); return n; };
  const layerBoard = svg.appendChild(mk("g"));
  const layerWalls = svg.appendChild(mk("g"));
  const previewEl = svg.appendChild(mk("rect", { class: "preview", visibility: "hidden" }));
  const layerPawns = svg.appendChild(mk("g"));
  const layerZones = svg.appendChild(mk("g"));
  const pawnEls = [0, 1].map(() => {
    const g = layerPawns.appendChild(mk("g", { class: "pawn" }));
    g.appendChild(mk("circle", { r: 17, class: "body" }));
    g.appendChild(mk("text"));
    return g;
  });
  svg.addEventListener("mouseleave", () => { hover = null; updatePreview(); });
  const choice = { human: 0, level: "hard" };

  // ---------- tiện ích
  const el = (tag, attrs = {}, parent = svg) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    parent && parent.appendChild(n);
    return n;
  };
  const dr = r => flip ? 8 - r : r;            // hàng hiển thị của ô
  const dw = r => flip ? 7 - r : r;            // hàng hiển thị của neo tường
  const key = (o, r, c) => o + r + "," + c;
  const fmtAction = a => {
    if (!a) return "—";
    if (a.type === "move") return "đi tới [" + a.to.join(", ") + "]";
    if (a.type === "wall") return "tường " + (a.orientation === "H" ? "ngang" : "dọc") + " (" + a.row + ", " + a.col + ")";
    return "bỏ lượt";
  };

  async function api(path, body) {
    const res = await fetch(path, body === undefined ? {} : {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    return res.json();
  }

  // ---------- vẽ
  function wallRect(o, r, c) {
    const R = dw(r);
    return o === "H"
      ? { x: c * U, y: R * U + S, width: 2 * S + G, height: G }
      : { x: c * U + S, y: R * U, width: G, height: 2 * S + G };
  }

  let legalWalls = new Set();
  let prevPositions = null;

  function render() {
    if (!state) return;
    flip = state.human === 1;
    layerBoard.textContent = ""; layerWalls.textContent = ""; layerZones.textContent = "";
    const you = state.human, bot = 1 - you;
    const myTurn = !busy && !state.done && state.current_player === you;
    const legal = new Set(myTurn ? state.legal_moves.map(m => m[0] + "," + m[1]) : []);
    legalWalls = new Set(state.legal_walls.map(w => key(w.orientation, w.row, w.col)));

    // ô
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      let cls = "cell";
      if (r === state.goal_rows[you]) cls += " goal-you";
      else if (r === state.goal_rows[bot]) cls += " goal-bot";
      const isLegal = legal.has(r + "," + c);
      if (isLegal) cls += " legal";
      const rect = el("rect", { x: c * U, y: dr(r) * U, width: S, height: S, rx: 7, class: cls }, layerBoard);
      if (isLegal) rect.addEventListener("click", () => act({ type: "move", to: [r, c] }));
    }
    if (myTurn) for (const m of state.legal_moves)
      el("circle", { cx: m[1] * U + S / 2, cy: dr(m[0]) * U + S / 2, r: 6, class: "legal-dot" }, layerBoard);

    // khung đánh dấu ô bot vừa rời đi
    const last = state.log[state.log.length - 1];
    if (last && last.player === bot && last.action && last.action.type === "move" && prevPositions) {
      const prev = prevPositions[bot];
      el("rect", { x: prev[1] * U + 3, y: dr(prev[0]) * U + 3, width: S - 6, height: S - 6, rx: 6,
                   class: "last", stroke: "var(--bot)" }, layerBoard);
    }

    // tường (màu theo người đặt; tường mới nhất hiện dần)
    const newest = state.wall_owners.length ? state.wall_owners[state.wall_owners.length - 1] : null;
    const newestKey = newest ? key(newest.o, newest.r, newest.c) : null;
    for (const w of state.wall_owners) {
      const k = key(w.o, w.r, w.c);
      el("rect", { ...wallRect(w.o, w.r, w.c),
                   class: "wall " + (w.owner === you ? "you" : "bot") + (k === newestKey && k !== lastWallKey ? " new" : "") },
         layerWalls);
    }
    lastWallKey = newestKey;

    // quân (phần tử cố định -> trượt mượt)
    for (const p of [0, 1]) {
      const [r, c] = state.positions[p];
      const g = pawnEls[p];
      g.style.transform = `translate(${c * U + S / 2}px, ${dr(r) * U + S / 2}px)`;
      g.querySelector("circle").setAttribute("fill", p === you ? "var(--you)" : "var(--bot)");
      const t = g.querySelector("text");
      t.textContent = p === you ? "B" : "AI";
      t.style.fontSize = p === you ? "15px" : "12px";
    }

    // vùng bắt chuột cho tường (khe giữa các ô)
    if (myTurn && state.walls_remaining[you] > 0) {
      for (let g = 0; g < 8; g++) for (let c = 0; c < 9; c++) {         // khe ngang
        const z = el("rect", { x: c * U, y: g * U + S, width: S, height: G, class: "zone" }, layerZones);
        bindZone(z, { o: "H", r: flip ? 7 - g : g, c: Math.min(c, 7) });
      }
      for (let d = 0; d < 9; d++) for (let c = 0; c < 8; c++) {         // khe dọc
        const z = el("rect", { x: c * U + S, y: d * U, width: G, height: S, class: "zone" }, layerZones);
        const top = Math.min(d, 7);
        bindZone(z, { o: "V", r: flip ? 7 - top : top, c });
      }
    } else hover = null;
    updatePreview();
    renderSide();
  }

  function updatePreview() {
    if (!hover || !state) { previewEl.setAttribute("visibility", "hidden"); return; }
    const ok = legalWalls.has(key(hover.o, hover.r, hover.c));
    for (const [k, v] of Object.entries(wallRect(hover.o, hover.r, hover.c))) previewEl.setAttribute(k, v);
    previewEl.setAttribute("class", "preview " + (ok ? "ok" : "no"));
    previewEl.setAttribute("visibility", "visible");
  }

  function bindZone(z, anchor) {
    z.addEventListener("mouseenter", () => { hover = anchor; updatePreview(); });
    z.addEventListener("mouseleave", () => { if (hover === anchor) { hover = null; updatePreview(); } });
    z.addEventListener("click", () => {
      hover = null; updatePreview();
      act({ type: "wall", orientation: anchor.o, row: anchor.r, col: anchor.c });
    });
  }

  function wallsBar(node, left) {
    node.textContent = "";
    for (let i = 0; i < 10; i++) {
      const s = document.createElement("i");
      if (i >= left) s.className = "used";
      node.appendChild(s);
    }
  }

  function renderSide() {
    const you = state.human, bot = 1 - you;
    document.getElementById("bot-name").textContent = "Bot (" + state.bot_name + ")";
    wallsBar(document.getElementById("you-walls"), state.walls_remaining[you]);
    wallsBar(document.getElementById("bot-walls"), state.walls_remaining[bot]);
    document.getElementById("you-meta").textContent = state.walls_remaining[you] + " tường · " + (you === 0 ? "đi trước" : "đi sau");
    const info = state.bot_info;
    document.getElementById("bot-meta").textContent = state.walls_remaining[bot] + " tường" +
      (info ? " · nghĩ " + info.time + "s" + (info.depth ? ", sâu " + info.depth : "") : "");
    document.getElementById("you-dist").firstChild.nodeValue = state.distances[you];
    document.getElementById("bot-dist").firstChild.nodeValue = state.distances[bot];
    document.getElementById("p-you").classList.toggle("active", !state.done && state.current_player === you);
    document.getElementById("p-bot").classList.toggle("active", !state.done && state.current_player === bot);
    document.getElementById("undo").disabled = !state.can_undo || busy;

    const ol = document.getElementById("log");
    ol.textContent = "";
    for (const e of state.log) {
      const li = document.createElement("li");
      li.className = e.player === you ? "you" : "bot";
      li.innerHTML = `<span class="n">${e.turn}</span><span class="w"></span><span class="a"></span><span class="t"></span>`;
      li.querySelector(".w").textContent = e.who;
      li.querySelector(".a").textContent = fmtAction(e.action) + (e.status === "invalid" ? " (sai)" : "");
      li.querySelector(".t").textContent = e.time !== undefined ? e.time + "s" : "";
      ol.appendChild(li);
    }
    ol.scrollTop = ol.scrollHeight;
    document.getElementById("log-empty").style.display = state.log.length ? "none" : "block";

    const banner = document.getElementById("banner");
    if (state.done) {
      const win = state.winner === you, draw = state.winner === null;
      banner.className = "banner show " + (draw ? "draw" : win ? "win" : "lose");
      document.getElementById("banner-text").textContent =
        draw ? "Hòa sau " + state.turn + " lượt." : win ? "Bạn thắng! Bot chịu thua." : "Bot thắng ván này.";
    } else banner.className = "banner";
    setStatus();
  }

  function setStatus(error) {
    const st = document.getElementById("status"), txt = document.getElementById("status-text");
    const dot = st.querySelector(".dot");
    const you = state.human;
    st.classList.toggle("thinking", busy);
    if (state.done) { txt.textContent = "Ván đấu kết thúc"; dot.style.background = "var(--muted)"; }
    else if (state.current_player === you) { txt.textContent = "Lượt của bạn"; dot.style.background = "var(--you)"; }
    else { txt.textContent = "Bot đang nghĩ…"; dot.style.background = "var(--bot)"; }
    document.getElementById("err").textContent = error || "";
  }

  // ---------- điều khiển
  function apply(s) {
    prevPositions = state ? state.positions.map(p => p.slice()) : null;
    state = s;
    render();
  }

  async function botTurn() {
    if (state.done || state.current_player === state.human) return;
    busy = true; render();
    const s = await api("/api/bot", {});
    busy = false; apply(s);
  }

  async function act(action) {
    if (busy || !state || state.done || state.current_player !== state.human) return;
    busy = true; render();
    const s = await api("/api/action", { action });
    busy = false;
    if (s.error) { apply(s); setStatus(s.error); return; }
    apply(s);
    await botTurn();
  }

  async function newGame() {
    if (busy) return;
    hover = null; prevPositions = null; lastWallKey = null;
    apply(await api("/api/new", { human: choice.human, level: choice.level }));
    await botTurn();
  }

  function seg(id, prop) {
    const box = document.getElementById(id);
    box.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      box.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      choice[prop] = prop === "human" ? Number(b.dataset.v) : b.dataset.v;
    });
  }
  seg("side-seg", "human");
  seg("level-seg", "level");
  document.getElementById("new").addEventListener("click", newGame);
  document.getElementById("again").addEventListener("click", newGame);
  document.getElementById("undo").addEventListener("click", async () => {
    if (busy) return;
    hover = null; prevPositions = null;
    apply(await api("/api/undo", {}));
  });
  document.getElementById("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("wrongway-theme", root.dataset.theme); } catch (e) {}
  });
  try { const t = localStorage.getItem("wrongway-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

  api("/api/state").then(s => { apply(s); botTurn(); });
})();
</script>
